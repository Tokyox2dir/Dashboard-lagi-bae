<div class="quotation-page">
  <section class="quotation-toolbar">
    <select id="quotationFilter" aria-label="Client filter">
      <option>All Client</option>
      <option>GOT_OTP</option>
      <option>SF_A2P</option>
      <option>GPI_INT</option>
      <option>Sahridaya_Dom</option>
    </select>
    <button type="button" onclick="renderQuotationList()">Search</button>
  </section>

  <section class="quotation-card">
    <div class="quotation-head">
      <span>Client / Supplier Name</span>
      <span>Action</span>
    </div>
    <div class="quotation-list" id="quotationList"></div>
  </section>

  <input type="file" id="quotationImportInput" accept=".csv" hidden />
</div>
